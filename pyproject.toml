[project]
name = "my-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "httpx>=0.28.1",
    "python-dotenv",
    "rich>=15.0.0",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
web-search = "my_agent.main:run"
